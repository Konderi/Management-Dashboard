apiVersion: v1
kind: Namespace
metadata:
  name: nexus-ops
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nexus-config
  namespace: nexus-ops
data:
  PORT: "3001"
  UNIFI_HOST: "https://192.168.1.1"
  ARUBA_HOST: "https://192.168.20.2"
  PROXMOX_HOST: "https://192.168.50.15:8006"
  OLLAMA_HOST: "http://192.168.50.21:11434"
  VLLM_HOST: "http://192.168.50.22:8000"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexus-dashboard
  namespace: nexus-ops
  labels:
    app: nexus-dashboard
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexus-dashboard
  template:
    metadata:
      labels:
        app: nexus-dashboard
    spec:
      containers:
        - name: dashboard
          image: nexus/management-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: nexus-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/snapshot
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/snapshot
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: nexus-service
  namespace: nexus-ops
spec:
  selector:
    app: nexus-dashboard
  ports:
    - port: 3001
      targetPort: 3001
      name: http
  type: ClusterIP
